[package]
name = "arraysslvpn-desktop"
version = "0.3.1"
edition = "2024"
license = "LGPL-2.1-only"
description = "Array Connect desktop client"

[lib]
name = "arraysslvpn_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "array-connect"
path = "src/main.rs"

[features]
default = ["embedded-openssl"]
embedded-openssl = ["arraysslvpn/openssl-vendored"]
system-openssl = ["arraysslvpn/openssl-tls"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arraysslvpn = { path = "../..", default-features = false, features = ["system-network"] }
async-trait = "0.1"
data-encoding = "2"
rand = "0.9"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
hmac = "0.12"
sha1 = "0.10"
ipnet = "2"
keyring = { version = "3.6", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_TaskScheduler", "Win32_System_Threading"] }
keyring = { version = "3.6", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
tauri = { version = "2", features = ["image-png"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
