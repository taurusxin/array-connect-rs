[package]
name = "arraysslvpn"
version = "0.5.0"
edition = "2024"
license = "LGPL-2.1-only"
description = "An asynchronous Array Networks SSL VPN client library and CLI"
default-run = "array-connect"

[features]
default = ["cli"]
system-network = ["dep:tun-rs", "dep:windows-sys", "dep:route_manager"]
cli = ["system-network", "dep:clap", "dep:crossterm", "dep:toml", "dep:tracing-subscriber"]
openssl-tls = ["dep:openssl", "dep:tokio-openssl"]
openssl-vendored = ["openssl-tls", "openssl/vendored"]
macos-network-service = ["system-network", "dep:cc", "dep:libc"]

[build-dependencies]
cc = { version = "1", optional = true }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
cookie_store = "0.22"
httparse = "1"
ipnet = { version = "2", features = ["serde"] }
rand = "0.9"
percent-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
openssl = { version = "0.10", optional = true }
tokio-openssl = { version = "0.6", optional = true }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = { version = "2", features = ["serde"] }
x509-parser = "0.18"
zeroize = "1"
tun-rs = { version = "2", default-features = false, features = ["async_tokio"], optional = true }
route_manager = { version = "0.2", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
crossterm = { version = "0.29", optional = true }
toml = { version = "0.9", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }

[[bin]]
name = "array-connect"
path = "src/bin/arraysslvpn/main.rs"
required-features = ["cli"]

[[bin]]
name = "array-connect-vpnd"
path = "src/bin/macos_network_service.rs"
required-features = ["macos-network-service"]

[[example]]
name = "gui_integration"
required-features = ["system-network"]
