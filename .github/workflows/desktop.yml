name: Desktop
on:
  push:
    branches: ['**']
    paths: ['desktop/**', 'src/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'src/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '12.20.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - uses: shogo82148/actions-setup-perl@v1
        if: runner.os == 'Windows'
        with:
          perl-version: '5.40'
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare
      - run: pnpm build
      - run: pnpm test
      - run: pnpm format:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build debug application without installers
        run: pnpm tauri build --debug --no-bundle -- --locked
      - name: Verify embedded Windows elevation manifest
        if: runner.os == 'Windows'
        run: ./scripts/verify-windows-manifest.ps1 -Executable src-tauri/target/debug/arraysslvpn-desktop.exe
