name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check tag and package versions without changing them
        id: version
        run: python .github/scripts/release.py validate --tag "$RELEASE_TAG"

  cli:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cli-${{ matrix.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - uses: shogo82148/actions-setup-perl@v1
        if: runner.os == 'Windows'
        with:
          perl-version: '5.40'
      - name: Build CLI with statically linked OpenSSL
        shell: bash
        run: cargo build --locked --release --bin arraysslvpn --features openssl-vendored --target "$RELEASE_TARGET"
      - name: Prepare verified Windows driver and license
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/scripts/prepare-wintun.ps1 -Architecture amd64
      - name: Package CLI
        shell: bash
        run: python .github/scripts/release.py cli --tag "$RELEASE_TAG" --target "$RELEASE_TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: release-cli-${{ matrix.target }}
          path: target/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_BUNDLES: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '12.20.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: release-desktop-${{ matrix.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev xdg-utils
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - uses: shogo82148/actions-setup-perl@v1
        if: runner.os == 'Windows'
        with:
          perl-version: '5.40'
      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Build desktop installers with embedded OpenSSL
        working-directory: desktop
        shell: bash
        env:
          # Ad-hoc signing needs no Apple account and is not notarization.
          APPLE_SIGNING_IDENTITY: '-'
          NO_STRIP: 'true'
        run: pnpm tauri build --ci --target "$RELEASE_TARGET" --bundles "$RELEASE_BUNDLES" -- --locked
      - name: Verify embedded Windows elevation manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/scripts/verify-windows-manifest.ps1 -Executable "desktop/src-tauri/target/$env:RELEASE_TARGET/release/arraysslvpn-desktop.exe"
      - name: Collect installers with unique platform names
        shell: bash
        run: python .github/scripts/release.py desktop --tag "$RELEASE_TAG" --target "$RELEASE_TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.target }}
          path: target/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    needs: [validate, cli, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: target/release-assets
          merge-multiple: true
      - name: Verify all CLI and desktop assets and generate SHA-256 checksums
        run: python .github/scripts/release.py checksums --tag "$RELEASE_TAG"
      - name: Publish one release after all platform builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            args=(--draft --verify-tag --title "Array Connect $RELEASE_TAG")
            notes_file="docs/releases/$RELEASE_TAG.md"
            if [[ -f "$notes_file" ]]; then
              args+=(--notes-file "$notes_file")
            else
              args+=(--generate-notes)
            fi
            if [[ "$PRERELEASE" == 'true' ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" target/release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
